name: Build Fit App (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses & Build APK
        run: |
          yes | flutter doctor --android-licenses || true
          printf "flet==0.24.1\nrequests\n" > requirements.txt
          pip install "flet==0.24.1" requests
          flet build apk --yes --verbose --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-Android-APK
          path: build/apk/*.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet & Build Unsigned iOS IPA
        run: |
          printf "flet==0.24.1\nrequests\n" > requirements.txt
          pip install "flet==0.24.1" requests
          flet build ipa --yes --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka" || true
          cd build/flutter
          flutter build ios --release --no-codesign
          mkdir -p ../ipa Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qq -r ../ipa/FitApp.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-iOS-IPA
          path: build/ipa/*.ipa

