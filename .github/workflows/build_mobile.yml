name: Build Fit App (Android & Web)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1: ANDROID APK
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses & Build APK
        run: |
          yes | flutter doctor --android-licenses || true
          printf "flet==0.25.2\n" > requirements.txt
          pip install "flet==0.25.2"
          flet build apk --verbose --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-Android-APK
          path: build/apk/*.apk

  # ============================================================
  # JOB 2: WEB (Dla iPhone 16 przez GitHub Pages)
  # ============================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Enable Flutter Web & Precache
        run: |
          flutter config --enable-web
          flutter precache --web

      - name: Install Flet & Build Web
        run: |
          printf "flet==0.25.2\n" > requirements.txt
          pip install "flet==0.25.2"
          flet build web --base-url /FitApka/ --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka" --verbose

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p ./pages_output
          cp -r build/web/. ./pages_output/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_output

  # ============================================================
  # JOB 3: PUBLIKACJA STRONY NA GITHUB PAGES
  # ============================================================
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
