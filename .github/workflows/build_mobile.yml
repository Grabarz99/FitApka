name: Build Fit App (Android & iOS & Web)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Uprawnienia do publikacji GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1: ANDROID APK
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses & Build APK
        run: |
          yes | flutter doctor --android-licenses || true
          printf "flet==0.25.2\nrequests\n" > requirements.txt
          pip install "flet==0.25.2" requests
          flet build apk --verbose --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-Android-APK
          path: build/apk/*.apk

  # ============================================================
  # JOB 2: iOS IPA
  # ============================================================
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet & Build Unsigned iOS IPA
        run: |
          printf "flet==0.25.2\nrequests\n" > requirements.txt
          pip install "flet==0.25.2" requests
          flet build ipa --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka" || true

          FLUTTER_DIR=$(find /tmp -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
          if [ -z "$FLUTTER_DIR" ]; then
            FLUTTER_DIR=$(find . -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
          fi

          echo "Znaleziony folder projektu Flutter: $FLUTTER_DIR"

          if [ -n "$FLUTTER_DIR" ] && [ -f "$FLUTTER_DIR/pubspec.yaml" ]; then
            cd "$FLUTTER_DIR"
            flutter build ios --release --no-codesign
            mkdir -p "$GITHUB_WORKSPACE/build/ipa" Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -qq -r "$GITHUB_WORKSPACE/build/ipa/FitApp.ipa" Payload
          else
            echo "BLAD: Nie znaleziono pubspec.yaml"
            exit 1
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-iOS-IPA
          path: build/ipa/*.ipa

  # Web build przez GitHub Actions nie jest mozliwy z Flet 0.25.2
  # Uzyj Render.com do hostowania wersji web:
  # Start Command: python -m flet run main.py --web --port $PORT --host 0.0.0.0
  # Environment: PYTHON_VERSION=3.11.0
