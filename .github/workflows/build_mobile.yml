name: Build Fit App (Android & iOS & Web)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Uprawnienia do publikacji GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1: ANDROID APK
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses & Build APK
        run: |
          yes | flutter doctor --android-licenses || true
          printf "flet==0.25.2\nrequests\n" > requirements.txt
          pip install "flet==0.25.2" requests
          flet build apk --verbose --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-Android-APK
          path: build/apk/*.apk

  # ============================================================
  # JOB 2: iOS IPA
  # ============================================================
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet & Build Unsigned iOS IPA
        run: |
          printf "flet==0.25.2\nrequests\n" > requirements.txt
          pip install "flet==0.25.2" requests
          flet build ipa --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka" || true

          FLUTTER_DIR=$(find /tmp -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
          if [ -z "$FLUTTER_DIR" ]; then
            FLUTTER_DIR=$(find . -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
          fi

          echo "Znaleziony folder projektu Flutter: $FLUTTER_DIR"

          if [ -n "$FLUTTER_DIR" ] && [ -f "$FLUTTER_DIR/pubspec.yaml" ]; then
            cd "$FLUTTER_DIR"
            flutter build ios --release --no-codesign
            mkdir -p "$GITHUB_WORKSPACE/build/ipa" Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -qq -r "$GITHUB_WORKSPACE/build/ipa/FitApp.ipa" Payload
          else
            echo "BLAD: Nie znaleziono pubspec.yaml"
            exit 1
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitApp-iOS-IPA
          path: build/ipa/*.ipa

  # ============================================================
  # JOB 3: WEB (GitHub Pages)
  # ============================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install Flet & Build Web
        run: |
          printf "flet==0.25.2\nrequests\n" > requirements.txt
          pip install "flet==0.25.2" requests
          flet build web --product "Fit AI" --project "fit-ai-app" --org "pl.twojaapka" --verbose || true
          # Fallback: bezposredni build Flutter web
          if [ ! -d "build/web" ]; then
            echo "Probuje fallback Flutter web build..."
            FLUTTER_DIR=$(find /tmp -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
            if [ -z "$FLUTTER_DIR" ]; then
              FLUTTER_DIR=$(find . -name "pubspec.yaml" 2>/dev/null | head -n 1 | xargs dirname || true)
            fi
            if [ -n "$FLUTTER_DIR" ] && [ -f "$FLUTTER_DIR/pubspec.yaml" ]; then
              cd "$FLUTTER_DIR"
              flutter build web --release
              mkdir -p "$GITHUB_WORKSPACE/build/web"
              cp -r build/web/. "$GITHUB_WORKSPACE/build/web/"
            fi
          fi

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p ./pages_output
          if [ -d "build/web" ]; then
            cp -r build/web/. ./pages_output/
          else
            echo "Szukam folderu web..."
            WEB_DIR=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1 | xargs dirname || true)
            if [ -n "$WEB_DIR" ]; then
              cp -r "$WEB_DIR/." ./pages_output/
            else
              echo "BLAD: Nie znaleziono folderu web"
              exit 1
            fi
          fi
          echo "Zawartosc pages_output:"
          ls -la ./pages_output/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_output

  # ============================================================
  # JOB 4: DEPLOY na GitHub Pages
  # ============================================================
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
